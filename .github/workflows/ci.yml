name: Run Extension Tests

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'TheArqsz/JSRecon-Buddy' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject superseded CI run
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"

          if [[ "$current_sha" != "$TESTED_SHA" ]]; then
            echo "::error::main has advanced beyond this tested revision; wait for its CI run."
            exit 1
          fi

      - name: Create release token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Generate Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          output-file: "CHANGELOG.md"
          tag-prefix: "v"
          version-file: manifest.json
          release-count: 0
          preset: conventionalcommits
          git-user-name: "[JS Recon Buddy] Changelog Bot"
          git-user-email: "[JS-Recon-Buddy]-Changelog-Bot@users.noreply.github.com"
          skip-git-pull: 'true'
          git-push: 'false'
          skip-ci: 'true'

      - name: Validate release changes
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          TESTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$TESTED_SHA"

          git diff --exit-code "$TESTED_SHA" HEAD -- . \
            ':(exclude)manifest.json' \
            ':(exclude)CHANGELOG.md'

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const before = JSON.parse(execFileSync(
            'git',
            ['show', `${process.env.TESTED_SHA}:manifest.json`],
            { encoding: 'utf8' }
          ));
          const after = JSON.parse(readFileSync('manifest.json', 'utf8'));

          assert.equal(process.env.RELEASE_TAG, `v${after.version}`);

          delete before.version;
          delete after.version;

          assert.deepStrictEqual(after, before);
          NODE

          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Package extension
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p release
          cp -r src/ release/
          cp manifest.json release/

          (
            cd release
            zip -r "../js-recon-buddy-${RELEASE_TAG}.zip" .
          )

          cp "js-recon-buddy-${RELEASE_TAG}.zip" js-recon-buddy.zip

      - name: Install Cosign
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Sign release archives
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail

          cosign sign-blob --yes \
            --bundle "js-recon-buddy-${RELEASE_TAG}.zip.sigstore.json" \
            "js-recon-buddy-${RELEASE_TAG}.zip"

          cosign sign-blob --yes \
            --bundle js-recon-buddy.zip.sigstore.json \
            js-recon-buddy.zip

      - name: Verify release signatures
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          SIGNER_IDENTITY: https://github.com/TheArqsz/JSRecon-Buddy/.github/workflows/ci.yml@refs/heads/main
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail

          cosign verify-blob \
            --bundle "js-recon-buddy-${RELEASE_TAG}.zip.sigstore.json" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "js-recon-buddy-${RELEASE_TAG}.zip"

          cosign verify-blob \
            --bundle js-recon-buddy.zip.sigstore.json \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            js-recon-buddy.zip

      - name: Push release commit and tag atomically
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail

          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Remove authenticated remote URL
        if: ${{ always() }}
        run: git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"

      - name: Create GitHub Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            js-recon-buddy-${{ steps.changelog.outputs.tag }}.zip
            js-recon-buddy.zip
            js-recon-buddy-${{ steps.changelog.outputs.tag }}.zip.sigstore.json
            js-recon-buddy.zip.sigstore.json
          fail_on_unmatched_files: true
          draft: false
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          token: ${{ github.token }}
          make_latest: true
          body: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Publish to Firefox Add-on Store
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1
        with:
          addon-guid: '@jsrecon-buddy'
          xpi-path: js-recon-buddy.zip
          self-hosted: false
          license: MIT
          jwt-issuer: ${{ secrets.FIREFOX_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_SECRET }}
          approval-notes: |
            Automated submission from GitHub Actions for version ${{ steps.changelog.outputs.tag }}.
            For more information, please visit the [GitHub repository](https://github.com/${{ github.repository }}/releases/tag/${{ steps.changelog.outputs.tag }}).

      - name: Publish to Chrome Web Store
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: mobilefirstllc/cws-publish@569e87bc9a54ad7712ba6dc154a110d88af63b85 # latest resolved 2026-10-19
        with:
          action: 'publish'
          client_id: ${{ secrets.WEBSTORE_CLIENT }}
          client_secret: ${{ secrets.WEBSTORE_SECRET }}
          refresh_token: ${{ secrets.WEBSTORE_TOKEN }}
          extension_id: ${{ secrets.WEBSTORE_EXTENSION_ID }}
          zip_file: 'js-recon-buddy.zip'
