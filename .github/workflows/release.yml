name: Package and Release

on:
  workflow_run:
    workflows: ["Run Extension Tests"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  package-and-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject superseded CI run
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"

          if [[ "$current_sha" != "$TESTED_SHA" ]]; then
            echo "::error::main has advanced beyond this tested revision; wait for its CI run."
            exit 1
          fi

      # This one is used to properly pass main branch ruleset
      - name: Create release token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Generate Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@ee43def3241429afddab215ba89090cbf64fb45c # v6
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          output-file: "CHANGELOG.md"
          tag-prefix: "v"
          version-file: manifest.json
          release-count: 0
          preset: conventionalcommits
          git-user-name: "[JS Recon Buddy] Changelog Bot"
          git-user-email: "[JS-Recon-Buddy]-Changelog-Bot@users.noreply.github.com"
          skip-git-pull: 'true'
          git-push: 'false'
          skip-ci: 'true'

      - name: Validate release changes
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$TESTED_SHA"

          git diff --exit-code "$TESTED_SHA" HEAD -- . \
            ':(exclude)manifest.json' \
            ':(exclude)CHANGELOG.md'

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const before = JSON.parse(execFileSync(
            'git',
            ['show', `${process.env.TESTED_SHA}:manifest.json`],
            { encoding: 'utf8' }
          ));
          const after = JSON.parse(readFileSync('manifest.json', 'utf8'));

          assert.equal(process.env.RELEASE_TAG, `v${after.version}`);

          delete before.version;
          delete after.version;

          assert.deepStrictEqual(after, before);
          NODE

          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Package extension
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p release
          cp -r src/ release/
          cp manifest.json release/

          (
            cd release
            zip -r "../js-recon-buddy-${RELEASE_TAG}.zip" .
          )

          cp "js-recon-buddy-${RELEASE_TAG}.zip" js-recon-buddy.zip

      - name: Push release commit and tag atomically
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail

          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Remove authenticated remote URL
        if: ${{ always() }}
        run: git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"

      - name: Create GitHub Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            js-recon-buddy-${{ steps.changelog.outputs.tag }}.zip
            js-recon-buddy.zip
          fail_on_unmatched_files: true
          draft: false
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          token: ${{ github.token }}
          make_latest: true
          body: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Publish to Firefox Add-on Store
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1
        with:
          addon-guid: '@jsrecon-buddy'
          xpi-path: js-recon-buddy.zip
          self-hosted: false
          license: MIT
          jwt-issuer: ${{ secrets.FIREFOX_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_SECRET }}
          approval-notes: |
            Automated submission from GitHub Actions for version ${{ steps.changelog.outputs.tag }}.
            For more information, please visit the [GitHub repository](https://github.com/${{ github.repository }}/releases/tag/${{ steps.changelog.outputs.tag }}).

      - name: Publish to Chrome Web Store
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: mobilefirstllc/cws-publish@024d5b5a69f0dfe85c216198f7aea6f95a3ea18b # latest resolved 2026-10-19
        with:
          action: 'publish'
          client_id: ${{ secrets.WEBSTORE_CLIENT }}
          client_secret: ${{ secrets.WEBSTORE_SECRET }}
          refresh_token: ${{ secrets.WEBSTORE_TOKEN }}
          extension_id: ${{ secrets.WEBSTORE_EXTENSION_ID }}
          zip_file: 'js-recon-buddy.zip'
